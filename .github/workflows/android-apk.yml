name: Android APK de prueba
on:
  push:
    paths: ['android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Modelo local en español
        run: |
          curl --fail --location --retry 2 --max-time 180 https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip -o /tmp/model.zip
          unzip -q /tmp/model.zip -d /tmp/vosk
          mkdir -p android/app/src/main/assets
          mv /tmp/vosk/vosk-model-small-es-0.42 android/app/src/main/assets/model-es
          echo 'smarthub-es-0.42-v1' > android/app/src/main/assets/model-es/uuid
      - name: Comprobar y compilar APK
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Huella de esta APK para Firebase
        run: keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android > android/app/build/outputs/apk/debug/FIREBASE-SHA.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SmartHub-Android-prueba
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/FIREBASE-SHA.txt
          retention-days: 30
