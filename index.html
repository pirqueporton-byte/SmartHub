<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Portón Pirque - Acceso</title>
<meta name="theme-color" content="#F8F9FA">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #F5F7FA; --surface: #FFFFFF; --border: #E4E7EB; --text-main: #111827; --text-muted: #6B7280; --primary: #0F172A; }
  [data-theme="dark"] { --bg: #121418; --surface: #1E2128; --border: #2C303A; --text-main: #F3F4F6; --text-muted: #9CA3AF; --primary: #F8FAFC; }
  [data-theme="grey"] { --bg: #202124; --surface: #292A2D; --border: #3C4043; --text-main: #E8EAED; --text-muted: #9AA0A6; --primary: #8AB4F8; }
  
  * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
  body { margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg); color: var(--text-main); padding: 20px; transition: 0.3s; }
  .user-card { background: var(--surface); width: 100%; max-width: 400px; border-radius: 24px; padding: 40px 24px; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.1); text-align: center; border: 1px solid var(--border); transition: 0.3s; }
  .btn-google { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; background: var(--surface); border: 1px solid var(--border); color: var(--text-main); font-weight: 600; padding: 14px; border-radius: 999px; cursor: pointer; margin-top: 20px; transition: 0.2s; }
  .btn-google:hover { background: var(--bg); }
  .btn-google svg { width: 20px; height: 20px; }
  .loader { border: 3px solid var(--border); border-top: 3px solid var(--primary); border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; margin: 0 auto; display: none; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body data-theme="dark">

<div class="user-card" id="vista-login">
  <h1 style="margin:0 0 10px; font-size: 24px; letter-spacing: -0.5px;">Portón Pirque</h1>
  <p style="color:var(--text-muted); font-size:14px; margin-bottom: 24px;">Inicia sesión para acceder.</p>
  
  <div id="loading" class="loader"></div>

  <button class="btn-google" id="btn-login" onclick="iniciarSesion()">
    <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 6 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 16 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.5 6 29.5 4 24 4c-7.7 0-14.3 4.3-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2c-2 1.5-4.6 2.4-7.2 2.4-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.6 39.6 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.6l6.2 5.2C39.9 37 44 31 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
    Continuar con Google
  </button>
  
  <p id="msg-error" style="color:#D93025; font-size:13px; margin-top:16px; display:none;"></p>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script>
// Motor de Temas
function aplicarTema(tema) {
  if (tema === 'light') document.body.removeAttribute('data-theme');
  else document.body.setAttribute('data-theme', tema);
  localStorage.setItem('riegoTheme', tema);
}
aplicarTema(localStorage.getItem('riegoTheme') || 'dark');

const firebaseConfig = { apiKey: "AIzaSyCABy9Rpn1wc1gYBzDEm8Mf05x0gu9lpyQ", authDomain: "portonpirque.firebaseapp.com", databaseURL: "https://portonpique-default-rtdb.firebaseio.com/", projectId: "portonpirque" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database(); const auth = firebase.auth(); const provider = new firebase.auth.GoogleAuthProvider();
const ADMIN_EMAIL = "pirqueporton@gmail.com";

function mostrarCarga(mostrar) {
    document.getElementById('loading').style.display = mostrar ? 'block' : 'none';
    document.getElementById('btn-login').style.display = mostrar ? 'none' : 'flex';
}
function showError(msg) {
    const err = document.getElementById('msg-error');
    err.textContent = msg; err.style.display = 'block';
    mostrarCarga(false);
}
function redireccionar(user) {
    if (user.email === ADMIN_EMAIL) { window.location.href = 'admin_inicio.html'; } 
    else {
        db.ref(`lista_blanca/${user.uid}`).once('value').then((snap) => {
            if(snap.exists()) { window.location.href = 'usuario.html'; } 
            else { showError('Tu cuenta no está autorizada.'); auth.signOut(); }
        }).catch(e => showError('Error al verificar permisos.'));
    }
}
auth.onAuthStateChanged((user) => { if(user) { mostrarCarga(true); redireccionar(user); } });
function iniciarSesion() {
    mostrarCarga(true); document.getElementById('msg-error').style.display = 'none';
    auth.signInWithPopup(provider).catch(e => showError('Error: ' + e.message));
}
</script>
</body>
</html>
